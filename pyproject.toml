[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "topdata-inner"
version = "0.1.0"
description = "Cliente Python (asyncio) para a API HTTP das catracas Topdata com controladora Inner."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sam Douglas" }]
requires-python = ">=3.10"
dependencies = ["httpx>=0.24"]
keywords = ["topdata", "inner", "catraca", "controle de acesso", "turnstile"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Natural Language :: Portuguese (Brazilian)",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]

[project.urls]
Repository = "https://github.com/samdouglask88/topdata-inner"

[tool.hatch.build.targets.wheel]
packages = ["src/topdata_inner"]
